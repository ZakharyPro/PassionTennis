<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0A2A55" />
<title>PassionTennis — Coaching Tennis & Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;}
  html,body{margin:0;padding:0}
  body{
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    max-width:100vw;
  }
  :root{
    --bg:#EFEEEA;
    --paper:#FBFAF6;
    --ink:#0A1628;
    --ink-2:#3A4A5E;
    --ink-mute:#7A8597;
    --rule:rgba(10,22,40,.10);
    --hairline:rgba(10,22,40,.10);
    --brand:#0A2A55;
    --brand-2:#1B4FA0;
    --brand-3:#3573D1;
    --accent: oklch(0.86 0.16 110);

    --font-display:'Archivo', 'Helvetica Neue', sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;

    --section-py: 120px;
    --container: 1320px;
    --gutter: 24px;
    --btn-radius: 999px;
  }

  body[data-density="compact"]{ --section-py: 80px; }
  body[data-density="regular"]{ --section-py: 120px; }
  body[data-density="spacious"]{ --section-py: 160px; }

  body[data-btn="pill"]{ --btn-radius:999px; }
  body[data-btn="square"]{ --btn-radius:6px; }
  body[data-btn="ghost"]{ --btn-radius:0; }

  body[data-palette="blue"]{ --brand:#0A2A55; --brand-2:#1B4FA0; --brand-3:#3573D1; --accent: oklch(0.86 0.16 110); }
  body[data-palette="green"]{ --brand:#0F3D2E; --brand-2:#19694F; --brand-3:#2EA77E; --accent: oklch(0.82 0.13 95); }
  body[data-palette="black"]{ --brand:#0A0A0A; --brand-2:#1F1F1F; --brand-3:#3A3A3A; --accent: oklch(0.85 0.18 130); }
  body[data-palette="cobalt"]{ --brand:#0033A0; --brand-2:#1A4ED1; --brand-3:#3573ff; --accent: oklch(0.78 0.18 60); }

  body[data-typo="display"]{ --font-display:'Archivo', 'Helvetica Neue', sans-serif; }
  body[data-typo="editorial"]{ --font-display:'Fraunces', 'Times New Roman', serif; }
  body[data-typo="condensed"]{ --font-display:'Archivo Narrow', 'Helvetica Neue', sans-serif; }

  .t-container{ max-width: var(--container); margin: 0 auto; padding: 0 var(--gutter); }
  .t-eyebrow{ font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 18px;}
  .t-on-dark-eyebrow, .t-on-dark .t-eyebrow{ color: rgba(255,255,255,.55) !important; }

  .t-section-head{ display:grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items:end; margin-bottom: 56px;}
  .t-section-title{
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(38px, 4.4vw, 68px); line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
  }
  .t-section-title em{ font-style: italic; font-family: 'Fraunces', serif; font-weight: 500; color: var(--ink-2);}
  .t-on-dark .t-section-title{ color:#fff;}
  .t-on-dark .t-section-title em{ color: rgba(255,255,255,.55);}
  .t-section-desc{ font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 460px;}
  .t-on-dark .t-section-desc{ color: rgba(255,255,255,.65);}

  /* ========== NAV ========== */
  .t-nav{
    position: fixed; inset: 0 0 auto 0; z-index: 50;
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 22px 36px;
    background: rgba(239,238,234,.6); backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-bottom: 1px solid rgba(10,22,40,.06);
    width: 100%; max-width: 100vw;
  }
  .t-nav-l{ display:flex; gap: 36px; }
  .t-nav-mini{ display:flex; flex-direction:column; gap:2px; font-size: 11px; color: var(--ink); text-decoration:none; line-height:1.25; font-weight:500;}
  .t-nav-mini span:first-child{ color: var(--ink); }
  .t-nav-mini span:last-child{ color: var(--ink-2); }
  .t-nav-c{ display:flex; align-items:center; gap: 10px; justify-content:center; color: var(--ink);}
  .t-brand{ font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0.02em; }
  .t-nav-r{ display:flex; align-items:center; justify-content: flex-end; gap: 18px;}
  .t-nav-talk{
    background: transparent; border: 0; color: var(--ink); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; font-weight: 600; cursor: pointer; padding: 0; font-family: var(--font-body);
    border-bottom: 1.5px solid var(--ink); padding-bottom: 3px;
  }
  .t-nav-burger{
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--ink); color: #fff; border: 0; display:grid; place-items:center; cursor: pointer;
  }

  /* ========== HERO ========== */
  .t-hero{ padding: 100px 16px 16px; }
  .t-hero-canvas{
    position: relative;
    aspect-ratio: 16/9.4;
    min-height: 720px;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    color: #fff;
    isolation: isolate;
  }
  .t-hero-bg{
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 30% 100%, color-mix(in oklab, var(--brand-3), white 20%) 0%, transparent 60%),
      radial-gradient(140% 100% at 80% 0%, color-mix(in oklab, var(--brand), black 15%) 0%, transparent 60%),
      linear-gradient(160deg, var(--brand-2), var(--brand) 80%);
    z-index: 0;
  }
  .t-hero-grain{
    position: absolute; inset: 0;
    background-image: linear-gradient(transparent 95%, rgba(255,255,255,.05) 95%), linear-gradient(90deg, transparent 95%, rgba(255,255,255,.05) 95%);
    background-size: 80px 80px;
    mix-blend-mode: overlay; opacity: .5; pointer-events:none; z-index:1;
  }
  .t-hero-figure{ position:absolute; inset:0; z-index: 2; pointer-events: none; overflow:hidden;}
  .t-hero-figure img{
    width:100%; height:100%; object-fit:cover; object-position: center 30%;
    display:block;
  }
  .t-hero-figure-overlay{
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom, rgba(10,22,40,.18) 0%, rgba(10,22,40,.55) 100%),
      linear-gradient(to right, rgba(10,22,40,.4) 0%, transparent 60%);
  }
  .t-hero-figure-fill{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 70% at 50% 55%, rgba(255,255,255,.18) 0%, transparent 65%),
      repeating-linear-gradient(110deg, rgba(255,255,255,.04) 0 8px, transparent 8px 24px),
      linear-gradient(180deg, color-mix(in oklab, var(--brand-3), white 5%) 0%, var(--brand) 90%);
    filter: blur(0.4px);
  }
  .t-figure-label{
    position:absolute; left:14px; top:14px; z-index:5;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform:uppercase;
    color: rgba(255,255,255,.7);
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px);
    padding: 6px 10px; border-radius: 999px;
  }

  .t-hero-title{
    position: absolute; left: 36px; right: 36px; top: 110px;
    margin: 0; padding: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(60px, 10.5vw, 195px);
    line-height: 0.86;
    letter-spacing: -0.045em;
    color: #fff;
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  body[data-typo="condensed"] .t-hero-title{ font-size: clamp(70px, 12vw, 220px); letter-spacing: -0.03em;}
  body[data-typo="editorial"] .t-hero-title{ font-weight: 600; letter-spacing: -0.03em; font-style: italic;}

  .t-name{
    position: absolute; z-index: 4; color: #fff; line-height: 1.1;
    display:flex; flex-direction: column; pointer-events:none;
  }
  .t-name .ttl{ font-size: 12px; font-weight: 600; letter-spacing: 0.02em;}
  .t-name .sub{ font-size: 11px; color: rgba(255,255,255,.7); }
  .t-name-1{ left: 36px; top: 270px;}
  .t-name-2{ left: 50%; top: 290px; transform: translateX(-50%);}
  .t-name-3{ right: 36px; top: 270px; text-align: right;}

  .t-hero-headline{
    position:absolute; left: 36px; bottom: 48px; z-index: 4;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(36px, 4.6vw, 76px); line-height: 0.92; letter-spacing: -0.03em;
    color: rgba(255,255,255,.92);
    text-shadow: 0 4px 30px rgba(0,0,0,.25);
  }
  body[data-typo="editorial"] .t-hero-headline{ font-weight: 500; font-style: italic;}

  .t-hero-feature{
    position: absolute; right: 36px; top: 50%; transform: translateY(-30%);
    width: 280px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
    border-radius: 20px; padding: 14px;
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    z-index: 5;
    color: #fff;
  }
  .t-hero-feature-thumb{ position:relative; aspect-ratio: 4/3; border-radius: 12px; overflow:hidden; background: var(--brand-2);}
  .t-hero-feature-thumb .t-figure-fill{ position:absolute; inset:0;}
  .t-hero-feature-body{ padding: 14px 4px 4px; }
  .t-hero-feature-eyebrow{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; color: rgba(255,255,255,.65); text-transform:uppercase;}
  .t-hero-feature-title{ font-size: 14.5px; font-weight: 600; line-height: 1.3; letter-spacing: 0.005em; margin: 8px 0 12px;}
  .t-hero-feature-link{ font-size: 12.5px; color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.4); padding-bottom: 2px; font-weight: 500;}

  .t-hero-stats{
    position: absolute; right: 36px; bottom: 48px;
    width: 200px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px; padding: 18px;
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    z-index: 5; color: #fff;
  }
  .t-hero-stats-num{ font-family: var(--font-display); font-weight: 800; font-size: 36px; letter-spacing: -0.02em; line-height: 1;}
  .t-hero-stats-num span{ color: var(--accent); }
  .t-hero-stats-avatars{ display: flex; margin-top: 12px;}
  .t-hero-stats-avatars span{ width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--brand);
    margin-left: -8px; background: linear-gradient(135deg, var(--accent), white);}
  .t-hero-stats-avatars span:first-child{ margin-left: 0; background: linear-gradient(135deg, #ffb478, #ed7250);}
  .t-hero-stats-avatars span:nth-child(2){ background: linear-gradient(135deg, #a4d8ff, #3573D1);}
  .t-hero-stats-avatars span:nth-child(3){ background: linear-gradient(135deg, #c4f08c, #6da033);}
  .t-hero-stats-avatars span:nth-child(4){ background: linear-gradient(135deg, #ffc8d8, #c8639a);}
  .t-hero-stats-lbl{ margin-top: 12px; font-size: 11.5px; color: rgba(255,255,255,.7);}

  .t-hero-dots{ position:absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display:flex; gap: 6px; z-index: 4;}
  .t-hero-dots .dot{ width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4);}
  .t-hero-dots .dot.active{ background: #fff; width: 18px; border-radius: 99px;}

  /* ========== TRUSTED ========== */
  .t-trusted{ padding: 80px 0 40px; }
  .t-trusted-grid{
    display: grid; grid-template-columns: 1fr 1.3fr; gap: 28px; align-items:center;
    margin-bottom: 60px;
  }
  .t-bubble{
    aspect-ratio: 1/1; max-width: 280px; justify-self: start;
    border-radius: 50%; background: #fff; padding: 30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 8px;
    box-shadow: 0 12px 40px -20px rgba(10,22,40,.15);
  }
  .t-bubble-num{ font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;}
  .t-bubble-num span{ color: var(--ink-2); }
  .t-bubble-cap{ font-size: 11px; color: var(--ink-2); text-align: center; line-height:1.4; }

  .t-trusted-card{
    background: #fff; border-radius: 24px; padding: 36px;
    display:grid; grid-template-columns: auto 1fr; gap: 36px; align-items:start;
    box-shadow: 0 12px 40px -20px rgba(10,22,40,.12);
  }
  .t-trusted-tag{ font-family: var(--font-display); font-weight: 800; font-size: 36px; letter-spacing: -0.02em; line-height: 1;}
  .t-trusted-body h3{ font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 10px;}
  .t-trusted-body p{ margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2);}
  .t-trusted-body em{ font-style: normal; font-weight: 600; color: var(--ink); }

  /* ========== SKILLED tilted-photo block ========== */
  .t-skilled{
    position: relative;
    padding: 80px 0 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .t-skilled-inner{
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .t-skilled-text{
    position: relative; inset: unset;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(60px, 9vw, 155px); line-height: 0.92; letter-spacing: -0.045em;
    color: var(--ink);
    overflow: visible;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  body[data-typo="editorial"] .t-skilled-text{ font-style: italic; font-weight: 500;}
  .t-skilled-row{ display:flex; gap: 0.4ch; align-items: center; }
  .t-skilled-row:last-child{ justify-content: flex-start; }
  .t-skilled-row .word.muted{ color: rgba(10,22,40,.13);}

  /* Card photo */
  .t-skilled-photo{
    position: relative; z-index: 2;
    width: 260px; height: 360px;
    transform: rotate(var(--coach-rotate, -8deg));
    transition: transform .45s cubic-bezier(.22,.68,0,1.2);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 40px 100px -20px rgba(10,22,40,.38);
    background: var(--brand);
  }
  .t-skilled-photo img{
    width: 100%; height: 100%; object-fit: cover; object-position: var(--coach-pos, center top);
    display: block;
  }
  @keyframes coachEnterNext{
    from{ opacity:0; transform: rotate(14deg) scale(0.88); }
    to{   opacity:1; transform: rotate(0deg)  scale(1); }
  }
  @keyframes coachEnterPrev{
    from{ opacity:0; transform: rotate(-14deg) scale(0.88); }
    to{   opacity:1; transform: rotate(0deg)   scale(1); }
  }
  .coach-img--next{ animation: coachEnterNext .45s cubic-bezier(.22,.68,0,1.2); }
  .coach-img--prev{ animation: coachEnterPrev .45s cubic-bezier(.22,.68,0,1.2); }

  /* Name tag inside photo */
  .t-skilled-tag{
    position:absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(10,22,40,.72);
    color: #fff;
    padding: 9px 18px; border-radius: 12px;
    backdrop-filter: blur(14px);
    z-index: 3; min-width: 170px; text-align: center;
    border: 1px solid rgba(255,255,255,.12);
  }
  .t-skilled-tag-name{ font-size: 13px; font-weight: 700; }
  .t-skilled-tag-role{ font-size: 11px; color: rgba(255,255,255,.65); margin-top: 2px; }

  /* Arrows flanking the card */
  .t-skilled-nav{
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    pointer-events: none;
    z-index: 5;
  }
  .t-arrow-btn{
    width: 52px; height: 52px; border-radius: 50%;
    border: 1.5px solid rgba(10,22,40,.22); background: rgba(255,255,255,.9);
    color: var(--ink); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
    pointer-events: all;
    backdrop-filter: blur(8px);
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 4px 20px rgba(10,22,40,.1);
  }
  .t-arrow-btn:hover{ transform: scale(1.08); box-shadow: 0 8px 28px rgba(10,22,40,.18); }
  .t-arrow-btn.dark{ background: var(--ink); color: #fff; border-color: var(--ink);}
  .t-arrow-btn.dark:hover{ background: #000; }

  /* Dots indicator */
  .t-skilled-dots{
    display: flex; gap: 8px; margin-top: 28px; align-items: center; justify-content: center;
  }
  .t-skilled-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(10,22,40,.18);
    transition: background .25s, transform .25s;
    cursor: pointer; border: none; padding: 0;
  }
  .t-skilled-dot.is-active{
    background: var(--ink); transform: scale(1.3);
  }

  /* legacy compat */
  .t-skilled-ball{ display: none; }
  .t-skilled-arrows{ display: none; }

  /* ========== FACILITIES — ALL COURT ========== */
  .t-facilities{ padding: 72px 0; background: var(--paper); }
  @keyframes facFadeIn{
    from{ opacity:0; transform: translateY(8px);}
    to{   opacity:1; transform: translateY(0);}
  }

  .t-fac-header{ display:flex; align-items:baseline; gap: 32px; flex-wrap:wrap; margin-bottom: 32px; }
  .t-fac-title2{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em;
    margin: 0; color: var(--ink);
  }
  .t-fac-tabs2{ display:flex; flex-wrap:wrap; gap: 8px; margin-left: auto; }
  .t-fac-tab{
    border: 1px solid var(--hairline); background: transparent;
    padding: 8px 18px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-2); cursor: pointer; font-family: var(--font-body);
    transition: background .15s, color .15s, border-color .15s;
  }
  .t-fac-tab[aria-selected="true"]{ background: var(--ink); color: #fff; border-color: var(--ink);}

  .t-fac-body{
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 28px;
    align-items: start;
    animation: facFadeIn .4s ease;
  }
  .t-fac-photo{
    position: relative; border-radius: 18px; overflow: hidden;
    aspect-ratio: 3/4; min-height: 340px; background: var(--brand);
  }
  .t-fac-photo-label{
    position: absolute; bottom: 14px; left: 14px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: #fff; background: rgba(0,0,0,.38); backdrop-filter: blur(8px);
    padding: 6px 12px; border-radius: 999px;
  }

  .t-fac-sheet{ display: flex; flex-direction: column; gap: 20px; }
  .t-fac-stats-row{ display: flex; flex-wrap: wrap; gap: 10px; }
  .t-fac-stat-pill{
    display: flex; flex-direction: column; gap: 2px;
    background: #fff; border: 1px solid var(--hairline);
    padding: 10px 16px; border-radius: 12px; min-width: 110px;
  }
  .t-fac-stat-k{ font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-mute); }
  .t-fac-stat-v{ font-size: 14px; font-weight: 700; color: var(--ink); }

  .t-fac-block{ border-top: 1px solid var(--hairline); padding-top: 16px; }
  .t-fac-block-label{ font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-mute); margin-bottom: 7px; }
  .t-fac-block-text{ font-size: 14px; line-height: 1.65; color: var(--ink-2); margin: 0; }

  .t-fac-refs{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--hairline); padding-top: 16px; }
  .t-fac-refs-label{ font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-mute); }
  .t-fac-refs-val{ font-size: 12.5px; font-weight: 600; color: var(--brand-2); }

  /* old cell selectors kept for mobile fallback */
  .t-fac-cell{ position: relative; border-radius: 18px; overflow:hidden; background: var(--brand); color: #fff; animation: facFadeIn .35s ease; }
  .t-fac-cell-foot{ position:absolute; left: 14px; right: 14px; bottom: 14px; z-index: 2; background: rgba(0,0,0,.35); backdrop-filter: blur(12px); padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); }
  .t-fac-cell-name{ font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .t-fac-cell-cap{ font-size: 12px; color: rgba(255,255,255,.75); line-height: 1.4;}

  /* placeholders */
  .t-figure-fill{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, transparent 12px 24px),
      linear-gradient(160deg, var(--brand-2) 0%, var(--brand) 80%);
  }
  .t-figure-fill.warm{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 12px, transparent 12px 24px),
      linear-gradient(160deg, #c8632b 0%, #6e2a10 80%);
  }
  .t-figure-fill.court{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
      linear-gradient(170deg, var(--brand-3) 0%, var(--brand) 80%);
  }
  .t-figure-fill.gym{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 12px, transparent 12px 24px),
      linear-gradient(160deg, #444 0%, #111 80%);
  }

  /* ========== PLAY STYLES ========== */
  .t-ps{ padding: var(--section-py) 0; background: #1a3a6b; color: #fff; }
  .t-ps-head{ max-width: 820px; margin-bottom: 48px; }
  .t-ps-title{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(48px, 7vw, 110px); line-height: 0.92;
    letter-spacing: -0.03em; margin: 12px 0 24px; color: #fff;
  }
  .t-ps-title em{ font-style: italic; font-family: 'Fraunces', serif; font-weight: 500; color: oklch(0.86 0.16 110); }
  .t-ps-intro{ font-size: 16px; line-height: 1.65; color: rgba(255,255,255,.6); max-width: 560px; margin: 0; }

  /* Layout sidebar + panel */
  .t-ps-layout{ display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }

  /* Nav list */
  .t-ps-nav{ display: flex; flex-direction: column; gap: 3px; }
  .t-ps-nav-btn{
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 13px 16px; border: 0; background: transparent;
    color: rgba(255,255,255,.45); cursor: pointer; text-align: left;
    border-radius: 10px; transition: background .18s, color .18s, border-color .18s;
    border-left: 2px solid transparent;
  }
  .t-ps-nav-btn:hover{ background: rgba(255,255,255,.06); color: rgba(255,255,255,.8); }
  .t-ps-nav-btn.is-active{ background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--ps-color, #fff); }
  .t-ps-nav-num{ font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; min-width: 22px; flex-shrink: 0; }
  .t-ps-nav-name{ font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; line-height: 1.1; }

  /* Panel */
  .t-ps-panel{
    position: relative; overflow: hidden;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px; padding: 40px;
    animation: psPanelIn .28s cubic-bezier(.22,.68,0,1.05);
  }
  @keyframes psPanelIn{ from{ opacity:0; transform:translateX(10px);} to{ opacity:1; transform:none;} }
  .t-ps-panel-deco{
    position: absolute; right: -16px; top: -24px;
    font-family: var(--font-display); font-weight: 900;
    font-size: 200px; line-height: 1; color: rgba(255,255,255,.04);
    pointer-events: none; user-select: none; letter-spacing: -0.05em;
  }
  .t-ps-panel-eyebrow{
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ps-color, oklch(0.86 0.16 110)); margin-bottom: 10px;
  }
  .t-ps-panel-name{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(28px, 3.5vw, 52px); letter-spacing: -0.03em;
    color: #fff; line-height: 0.95; margin-bottom: 8px;
  }
  .t-ps-panel-tag{ font-size: 14px; color: rgba(255,255,255,.5); font-style: italic; font-family: 'Fraunces', serif; margin-bottom: 24px; }
  .t-ps-panel-desc{
    font-size: 14.5px; line-height: 1.75; color: rgba(255,255,255,.65);
    margin: 0 0 24px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.1);
  }
  .t-ps-traits{ display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .t-ps-trait{
    font-size: 12px; padding: 5px 13px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.75);
  }
  .t-ps-ff{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .t-ps-ff-card{ padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); }
  .t-ps-ff-plus{ background: rgba(100,200,100,.06); }
  .t-ps-ff-minus{ background: rgba(255,255,255,.04); }
  .t-ps-ff-label{
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .t-ps-ff-plus .t-ps-ff-label{ color: oklch(0.86 0.16 110); }
  .t-ps-ff-minus .t-ps-ff-label{ color: rgba(255,255,255,.35); }
  .t-ps-ff-card p{ font-size: 12.5px; line-height: 1.6; color: rgba(255,255,255,.6); margin: 0; }
  .t-ps-panel-footer{
    display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start;
    border-top: 1px solid rgba(255,255,255,.1); padding-top: 20px;
  }
  .t-ps-meta-label{
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,.3); display: block; margin-bottom: 8px;
  }
  .t-ps-surf-pills{ display: flex; gap: 6px; flex-wrap: wrap; }
  .t-ps-surf-pill{
    font-size: 11px; font-weight: 600; padding: 4px 12px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.7);
  }
  .t-ps-pros-list{ display: flex; gap: 8px; flex-wrap: wrap; }
  .t-ps-pro-name{
    font-size: 11.5px; font-weight: 600; padding: 4px 12px;
    border-radius: 999px; background: var(--ps-color, var(--brand)); color: #fff; opacity: 0.9;
  }
  @media(max-width:860px){ .t-ps-ff{ grid-template-columns: 1fr; } }

  /* ========== SERVICES ========== */
  .t-services{ padding: var(--section-py) 0; }
  .t-services-outer{ position: relative; margin-top: 8px; }
  .t-services-arrows{
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 0 var(--gutter) 16px;
  }
  .t-arr-btn{
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--hairline); background: #fff;
    display: grid; place-items: center; cursor: pointer;
    font-size: 18px; line-height: 1;
    transition: background .18s, border-color .18s, color .18s;
  }
  .t-arr-btn:hover{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .t-services-track{
    display: flex; gap: 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px var(--gutter) 28px;
  }
  .t-services-track::-webkit-scrollbar{ display: none; }
  .t-service-card{
    flex: 0 0 min(480px, 82vw);
    scroll-snap-align: start;
    border-radius: 24px; overflow: hidden;
    background: #fff;
    box-shadow: 0 24px 60px -30px rgba(10,22,40,.15);
    border: 1px solid var(--hairline);
    display: flex; flex-direction: column;
  }
  .t-service-art{ aspect-ratio: 5/4; overflow:hidden; position:relative; background: var(--brand); color:#fff; flex-shrink: 0;}
  .t-service-body{ padding: 32px; display: flex; flex-direction: column; flex: 1; }
  .t-service-chips{ display:flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;}
  .t-chip{ font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius:999px;
    background: var(--bg); color: var(--ink-2); border:1px solid var(--hairline); letter-spacing:0.06em; text-transform:uppercase;}
  .t-service-title{ font-family: var(--font-display); font-size: clamp(24px,2.6vw,36px); line-height: 1.05;
    letter-spacing:-0.02em; margin:0 0 14px; font-weight:800;}
  body[data-typo="editorial"] .t-service-title{ font-weight: 600;}
  .t-service-desc{ font-size: 15px; line-height: 1.6; color: var(--ink-2); margin: 0 0 20px;}
  .t-service-list{ list-style:none; padding:0; margin: 0 0 24px; display:grid; gap: 10px;}
  .t-service-list li{ display:flex; gap: 10px; align-items:flex-start; font-size: 14px; color: var(--ink); }
  .t-service-bullet{ width:18px; height:18px; flex-shrink:0; border-radius:50%; background: var(--accent); display:grid; place-items:center; margin-top:2px;}
  .t-service-bullet svg{ width:10px; height:10px; color: var(--ink); }
  .t-service-price{ display:flex; gap: 12px; align-items:baseline; padding: 16px 0 0; border-top: 1px solid var(--hairline); flex-wrap: wrap; margin-top: auto;}
  .t-service-from{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color: var(--ink-mute);}
  .t-service-num{ font-family: var(--font-display); font-size: 34px; font-weight:800; letter-spacing:-0.02em; line-height:1;}
  .t-service-per{ color: var(--ink-mute); font-size:13px;}
  .t-service-note{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); width: 100%; padding-top: 4px;}

  /* generic dark button */
  .t-btn{ display:inline-flex; align-items:center; gap: 8px; padding: 14px 22px;
    border-radius: var(--btn-radius); border: 1px solid transparent;
    font-family: var(--font-body); font-weight: 600; font-size: 13.5px; cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .t-btn:hover{ transform: translateY(-1px);}
  .t-btn-dark{ background: var(--ink); color: #fff; }
  .t-btn-dark:hover{ background: #000; }
  .t-btn-light{ background: #fff; color: var(--ink); border-color: var(--hairline); }
  body[data-btn="ghost"] .t-btn{ background: transparent !important; color: var(--ink); border-color: currentColor;}
  body[data-btn="ghost"] .t-btn-dark{ color: var(--ink);}

  /* ========== TRANSFORMATIONS ========== */
  .t-transforms{ padding: var(--section-py) 0; background: var(--paper);}
  .t-tx-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px;}
  .t-tx-card{ background: #fff; border-radius: 24px; padding: 22px; display:flex; flex-direction:column; gap: 16px;
    box-shadow: 0 12px 30px -20px rgba(10,22,40,.12);}
  .t-tx-card.is-dark{ background: var(--brand); color:#fff;}
  .t-tx-photo{ aspect-ratio: 4/3; border-radius: 16px; overflow:hidden; position:relative; background: var(--brand-2);}
  .t-tx-quote{ font-family: var(--font-display); font-size: 19px; line-height: 1.3; letter-spacing: -0.005em; font-weight: 600; margin: 0;}
  body[data-typo="editorial"] .t-tx-quote{ font-weight: 500;}
  .t-tx-stats{ display:flex; gap: 18px;}
  .t-tx-stat .n{ font-family: var(--font-display); font-size: 28px; font-weight:800; letter-spacing:-0.02em; line-height:1;}
  .t-tx-stat .l{ font-size: 11px; color: var(--ink-mute); margin-top: 4px; text-transform:uppercase; letter-spacing:0.1em;}
  .t-tx-card.is-dark .t-tx-stat .l{ color: rgba(255,255,255,.55);}
  .t-tx-meta{ display:flex; align-items:center; gap: 12px; margin-top:auto; padding-top: 14px; border-top: 1px solid var(--hairline);}
  .t-tx-card.is-dark .t-tx-meta{ border-color: rgba(255,255,255,.14);}
  .t-tx-avatar{ width:38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent), white 30%));}
  .t-tx-name{ font-weight: 700; font-size: 13.5px;}
  .t-tx-role{ font-size: 12px; color: var(--ink-mute);}
  .t-tx-card.is-dark .t-tx-role{ color: rgba(255,255,255,.6);}

  /* ========== AUDIENCES ========== */
  .t-audiences{ padding: var(--section-py) 0;}
  .t-aud-grid{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);}
  .t-aud{ padding: 36px 24px; border-right: 1px solid var(--hairline); transition: background .25s ease;}
  .t-aud:last-child{ border-right: 0;}
  .t-aud:hover{ background: var(--paper);}
  .t-aud-num{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.14em;}
  .t-aud h4{ font-family: var(--font-display); font-size: 26px; line-height: 1.05; letter-spacing: -0.01em; margin: 16px 0 12px; font-weight: 700;}
  .t-aud p{ font-size: 14px; line-height: 1.55; color: var(--ink-2); margin: 0;}

  /* ========== METHOD ========== */
  .t-method{ padding: var(--section-py) 0; background: #1a3a6b; color: #fff;}
  .t-method-list{ border-top: 1px solid rgba(255,255,255,.15);}
  .t-step{ display:grid; grid-template-columns: 80px 1fr 1.2fr 200px; gap: 32px; align-items: start;
    padding: 40px 0; border-bottom: 1px solid rgba(255,255,255,.15); transition: background .25s ease;}
  .t-step:hover{ background: rgba(255,255,255,.03);}
  .t-step-n{ font-family: var(--font-display); font-size: 56px; font-weight:800; letter-spacing: -0.02em; line-height: 1; color: var(--accent);}
  body[data-typo="editorial"] .t-step-n{ font-style: italic; font-weight: 500;}
  .t-step h3{ font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; margin: 0;}
  .t-step p{ font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.7); margin: 0;}
  .t-step-dur{ font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(255,255,255,.55); padding-top: 12px;}

  /* ========== TESTIMONIALS ========== */
  .t-testimonials{ padding: var(--section-py) 0; background: var(--paper);}
  .t-test-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;}
  .t-test{ background: #fff; padding: 28px; border-radius: 22px; display:flex; flex-direction:column; gap: 18px;
    box-shadow: 0 12px 30px -20px rgba(10,22,40,.10);}
  .t-test-stars{ color: var(--accent); display:flex; gap: 2px;}
  .t-test blockquote{ margin:0; font-family: var(--font-display); font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -0.005em;}
  body[data-typo="editorial"] .t-test blockquote{ font-weight: 500;}
  .t-test footer{ display:flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--hairline);}

  /* ========== CTA ========== */
  .t-cta{ padding: 16px;}
  .t-cta-canvas{
    background: var(--brand); color:#fff; border-radius: 28px;
    padding: 80px 56px; position: relative; overflow:hidden;
    display:grid; grid-template-columns: 1.05fr 1fr; gap: 64px;
  }
  .t-cta-canvas::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(60% 80% at 90% 30%, color-mix(in oklab, var(--brand-3), white 20%) 0%, transparent 60%),
      radial-gradient(80% 100% at 0% 110%, color-mix(in oklab, var(--brand), black 30%) 0%, transparent 60%);
    opacity: .5;
  }
  .t-cta-canvas > *{ position: relative; z-index: 1;}
  .t-cta-title{ font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 6.5vw, 110px);
    line-height: 0.92; letter-spacing: -0.03em; margin: 18px 0 20px;}
  .t-cta-title em{ font-style: italic; font-family: 'Fraunces', serif; font-weight: 500; color: var(--accent); display:block;}
  .t-cta-sub{ color: rgba(255,255,255,.75); font-size: 16px; line-height: 1.55; max-width: 460px; margin: 0;}
  .t-cta-info{ display: flex; gap: 32px; margin-top: 48px; flex-wrap: wrap;}
  .t-cta-info .k{ font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.55);}
  .t-cta-info .v{ margin-top: 8px; font-size: 16px; font-weight: 600;}

  .t-form{ background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 22px; padding: 28px; backdrop-filter: blur(14px);}
  .t-form-row{ display:flex; flex-direction:column; gap: 8px; margin-bottom: 16px;}
  .t-form-row label{ font-family: var(--font-mono); font-size: 11px; letter-spacing:0.14em; text-transform:uppercase; color: rgba(255,255,255,.55);}
  .t-form-row input, .t-form-row textarea{
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 14px; color: #fff; font-family: var(--font-body); font-size: 14px;
    outline: none; transition: border-color .2s ease; width: 100%;
  }
  .t-form-row input:focus, .t-form-row textarea:focus{ border-color: var(--accent);}
  .t-form-grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px;}
  .t-form-pills{ display:flex; gap: 8px; flex-wrap: wrap;}
  .t-form-pill{ padding: 10px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.85); cursor: pointer;}
  .t-form-pill[aria-selected="true"]{ background: var(--accent); color: var(--ink); border-color: transparent;}
  .t-form-submit{ width: 100%; padding: 18px; margin-top: 8px; background: var(--accent); color: var(--ink);
    border: 0; border-radius: var(--btn-radius); font-family: var(--font-body); font-weight: 700; font-size: 14px; cursor: pointer;}
  .t-form-note{ margin-top: 14px; font-size: 11.5px; color: rgba(255,255,255,.55); text-align:center; line-height: 1.5;}

  /* ========== FOOTER ========== */
  .t-footer{ background: var(--paper); padding: 64px 0 32px;}
  .t-footer-grid{ display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; padding: 0 var(--gutter) 56px; border-bottom: 1px solid var(--hairline); max-width: var(--container); margin: 0 auto;}
  .t-footer-logo{ font-family: var(--font-display); font-weight: 900; font-size: 36px; letter-spacing: -0.02em;}
  .t-footer-logo span{ color: var(--accent);}
  .t-footer-tag{ margin-top: 12px; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; max-width: 360px;}
  .t-footer-col h5{ font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 18px;}
  .t-footer-col ul{ list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;}
  .t-footer-col a{ color: var(--ink); text-decoration: none; font-size: 14px;}
  .t-footer-col a:hover{ color: var(--brand);}
  .t-footer-bot{ display: flex; justify-content: space-between; padding: 24px var(--gutter) 0; color: var(--ink-mute); font-size: 12.5px; max-width: var(--container); margin: 0 auto;}
  .t-socials{ display: flex; gap: 8px; margin-top: 24px;}
  .t-socials a{ width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hairline); display:grid; place-items: center; color: var(--ink); transition: all .2s;}
  .t-socials a:hover{ background: var(--ink); color: #fff; border-color: var(--ink);}

  /* ========== RESPONSIVE ========== */

  /* ── Tablette large (≤1100px) ── */
  @media (max-width: 1100px){
    .t-section-head{ grid-template-columns: 1fr; gap: 24px;}
    .t-trusted-grid, .t-cta-canvas{ grid-template-columns: 1fr; gap: 28px;}
    .t-fac-body{ grid-template-columns: 1fr; }
    .t-fac-photo{ aspect-ratio: 16/9; min-height: 200px; }
    .t-test-grid{ grid-template-columns: 1fr 1fr;}
    .t-aud-grid{ grid-template-columns: 1fr 1fr;}
    .t-aud{ border-right: 0; border-bottom: 1px solid var(--hairline);}
    .t-step{ grid-template-columns: 56px 1fr; gap: 14px;}
    .t-step p{ grid-column: 1 / -1; }
    .t-step-dur{ grid-column: 1 / -1; padding-top: 0;}
    .t-footer-grid{ grid-template-columns: 1fr 1fr;}
    .t-hero-feature{ display:none;}
    .t-hero-stats{ width: auto; right: 24px; left: auto; bottom: 24px;}
    .t-hero-headline{ left: 24px; bottom: 110px;}
    .t-hero-title{ left: 24px; right: 24px; top: 120px; white-space: normal;}
    .t-name{ display:none;}
    .t-ps-cols{ grid-template-columns: 1fr; gap: 20px;}
    .t-cta-info{ gap: 20px; margin-top: 28px;}
    .t-fac-header{ flex-direction: column; align-items: flex-start; gap: 16px;}
    .t-fac-tabs2{ margin-left: 0;}
  }

  /* ── Tablette (≤860px) ── */
  @media (max-width: 860px){
    :root{ --section-py: 72px; }
    .t-hero{ padding: 80px 12px 12px; }
    .t-hero-canvas{ height: 92svh; min-height: 520px; aspect-ratio: unset; border-radius: 20px; }
    .t-hero-title{ font-size: clamp(44px, 10vw, 110px); top: 100px; white-space: normal; }
    .t-hero-headline{ left: 20px; bottom: 90px; font-size: clamp(22px, 4vw, 48px); }
    .t-hero-stats{ right: 20px; bottom: 20px; width: 180px; padding: 14px; }
    .t-hero-stats-num{ font-size: 28px; }
    .t-hero-card{ display: none;}
    .t-trusted-grid{ grid-template-columns: 1fr; }
    .t-skilled{ padding: 40px 0; }
    .t-skilled-inner{ min-height: 440px; }
    .t-skilled-text{ font-size: clamp(52px, 12vw, 110px); }
    .t-skilled-photo{ width: 210px; height: 290px; }
    .t-skilled-nav{ padding: 0 24px; }

<script type="text/babel">
// ─── tweaks-panel ────────────────────────────────────────────────────────────
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;

  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:pointer;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);

  if (!fitsAsSegments) {
    return (
      <TweakRow label={label}>
        <select className="twk-field" value={value} onChange={(e) => {
          const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === e.target.value);
          onChange(m === undefined ? e.target.value : typeof m === 'object' ? m.value : m);
        }}>
          {options.map((o) => {
            const v = typeof o === 'object' ? o.value : o;
            const l = typeof o === 'object' ? o.label : o;
            return <option key={v} value={v}>{l}</option>;
          })}
        </select>
      </TweakRow>
    );
  }

  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); } };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

<script>
/* ── ANIMATIONS ENGINE ──────────────────────────────────────────────────── */
(function() {
  'use strict';

  /* ── 1. Custom cursor ───────────────────────────────────────────────── */
  const isMobile = () => window.innerWidth < 860 || 'ontouchstart' in window;
  let cursor, ring;

  function initCursor() {
    if (isMobile()) return;
    cursor = document.createElement('div'); cursor.id = 'pt-cursor';
    ring   = document.createElement('div'); ring.id   = 'pt-ring';
    document.body.append(cursor, ring);

    let mx = -100, my = -100, rx = -100, ry = -100;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

    let hovered = false;
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('button,a,[data-mag],.t-fac-tab,.t-services-tab,.t-ps-card-hd');
      hovered = !!el;
      ring.classList.toggle('is-hover', hovered);
    });

    (function loop() {
      cursor.style.transform = `translate(${mx}px,${my}px)`;
      rx += (mx - rx) * 0.1; ry += (my - ry) * 0.1;
      ring.style.transform = `translate(${rx}px,${ry}px)`;
      requestAnimationFrame(loop);
    })();
  }

  /* ── 2. Scroll reveal ───────────────────────────────────────────────── */
  function initReveal() {
    const style = document.createElement('style');
    // Sur mobile : fade seul, pas de translateY (évite l'effet de "scroll interne" dans les sections overflow:hidden)
    const mob = isMobile();
    style.textContent = mob ? `
      [data-reveal]{opacity:0;transition:opacity .6s ease;}
      [data-reveal].is-visible{opacity:1;}
    ` : `
      [data-reveal]{opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.22,.68,0,1.05),transform .7s cubic-bezier(.22,.68,0,1.05);}
      [data-reveal].is-visible{opacity:1;transform:none;}
      [data-reveal="left"]{transform:translateX(-50px);}
      [data-reveal="right"]{transform:translateX(50px);}
      [data-reveal="scale"]{transform:scale(.9);opacity:0;}
      [data-reveal].is-visible{transform:none;opacity:1;}
    `;
    document.head.append(style);

    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const delay = e.target.dataset.delay || 0;
        setTimeout(() => e.target.classList.add('is-visible'), +delay);
        io.unobserve(e.target);
      });
    }, { threshold: 0.12 });

    function tag() {
      /* Section titles */
      document.querySelectorAll('.t-section-title,.t-ps-title,.t-fac-title2,.t-cta-title').forEach((el,i) => {
        if (!el.dataset.reveal) { el.dataset.reveal=''; el.dataset.delay=0; io.observe(el); }
      });
      /* Eyebrows */
      document.querySelectorAll('.t-eyebrow').forEach(el => {
        if (!el.dataset.reveal) { el.dataset.reveal=''; el.dataset.delay=80; io.observe(el); }
      });
      /* Cards & blocks — stagger */
      document.querySelectorAll('.t-ps-card,.t-tx-card,.t-aud,.t-test,.t-fac-stat-pill,.t-fac-block').forEach((el,i) => {
        if (!el.dataset.reveal) { el.dataset.reveal=''; el.dataset.delay=i*60; io.observe(el); }
      });
      /* Service panel */
      document.querySelectorAll('.t-service-art').forEach(el => {
        if (!el.dataset.reveal) { el.dataset.reveal='right'; el.dataset.delay=100; io.observe(el); }
      });
      /* Bubbles */
      document.querySelectorAll('.t-bubble').forEach((el,i) => {
        if (!el.dataset.reveal) { el.dataset.reveal='scale'; el.dataset.delay=i*120; io.observe(el); }
      });
      /* Steps */
      document.querySelectorAll('.t-step').forEach((el,i) => {
        if (!el.dataset.reveal) { el.dataset.reveal=''; el.dataset.delay=i*80; io.observe(el); }
      });
      /* Trusted card */
      document.querySelectorAll('.t-trusted-card').forEach(el => {
        if (!el.dataset.reveal) { el.dataset.reveal='left'; el.dataset.delay=150; io.observe(el); }
      });
    }

    /* Re-tag after React renders */
    tag();
    setTimeout(tag, 600);
    setTimeout(tag, 1500);
  }

  /* ── 3. Parallax hero ───────────────────────────────────────────────── */
  function initParallax() {
    if (isMobile()) return;
    const hero = document.querySelector('.t-hero-canvas');
    if (!hero) return;
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (ticking) return;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        const img = hero.querySelector('img');
        if (img) img.style.transform = `translateY(${y * 0.3}px) scale(1.05)`;
        const title = hero.querySelector('.t-hero-title');
        if (title) title.style.transform = `translateY(${y * 0.15}px)`;
        ticking = false;
      });
      ticking = true;
    });
  }

  /* ── 4. Stat counter ────────────────────────────────────────────────── */
  function initCounters() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target;
        const target = parseFloat(el.dataset.count);
        const isInt  = Number.isInteger(target);
        const prefix = el.dataset.prefix || '';
        const suffix = el.dataset.suffix || '';
        let start = null;
        const dur = 1400;
        function tick(ts) {
          if (!start) start = ts;
          const p = Math.min((ts - start) / dur, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const val = isInt ? Math.round(target * ease) : (target * ease).toFixed(1);
          el.textContent = prefix + val + suffix;
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        io.unobserve(el);
      });
    }, { threshold: 0.5 });

    function tag() {
      document.querySelectorAll('.t-bubble-num,.t-hero-stat .val').forEach(el => {
        const raw = el.textContent.trim();
        if (el.dataset.count) return;
        const num = parseFloat(raw.replace(/[^\d.]/g,''));
        if (!isNaN(num) && num > 0) {
          el.dataset.count  = num;
          el.dataset.prefix = raw.match(/^[^\d]*/)?.[0] || '';
          el.dataset.suffix = raw.match(/[^\d.]+$/)?.[0] || '';
          io.observe(el);
        }
      });
    }
    tag(); setTimeout(tag, 800);
  }

  /* ── 5. Magnetic buttons ────────────────────────────────────────────── */
  function initMagnetic() {
    if (isMobile()) return;
    function attach(el) {
      if (el._mag) return; el._mag = true;
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        const dx = (e.clientX - r.left - r.width  / 2) * 0.35;
        const dy = (e.clientY - r.top  - r.height / 2) * 0.35;
        el.style.transform = `translate(${dx}px,${dy}px)`;
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = '';
      });
    }
    function tag() {
      document.querySelectorAll('.t-btn,.t-nav-talk,.t-arrow-btn,.t-form-submit').forEach(attach);
    }
    tag(); setTimeout(tag, 1000);
  }

  /* ── 6. Card tilt on hover ──────────────────────────────────────────── */
  function initTilt() {
    if (isMobile()) return;
    function attach(el) {
      if (el._tilt) return; el._tilt = true;
      el.style.transition = 'transform .15s ease, box-shadow .15s ease';
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width  - 0.5;
        const y = (e.clientY - r.top)  / r.height - 0.5;
        el.style.transform = `perspective(600px) rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.02)`;
        el.style.boxShadow = `${-x*18}px ${-y*18}px 40px rgba(10,22,40,.13)`;
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = '';
        el.style.boxShadow = '';
      });
    }
    function tag() {
      document.querySelectorAll('.t-trusted-card,.t-test-card').forEach(attach);
    }
    tag(); setTimeout(tag, 1000);
  }

  /* ── 7. Nav shrink on scroll ────────────────────────────────────────── */
  function initNav() {
    const nav = document.querySelector('.t-nav');
    if (!nav) { setTimeout(initNav, 500); return; }
    const s = document.createElement('style');
    s.textContent = `.t-nav{transition:padding .35s ease,background .35s ease,box-shadow .35s ease;} .t-nav.is-scrolled{padding-top:12px;padding-bottom:12px;box-shadow:0 4px 24px rgba(10,22,40,.08);}`;
    document.head.append(s);
    window.addEventListener('scroll', () => {
      nav.classList.toggle('is-scrolled', window.scrollY > 60);
    }, {passive:true});
  }

  /* ── 8. Smooth anchor links ─────────────────────────────────────────── */
  function initAnchors() {
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const t = document.querySelector(a.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth',block:'start'}); }
    });
  }

  /* ── 9. Section line-draw on scroll ────────────────────────────────── */
  function initLines() {
    const s = document.createElement('style');
    s.textContent = `
      .t-ps-card-hd::after{content:'';position:absolute;bottom:0;left:28px;right:28px;height:1px;background:rgba(255,255,255,.07);}
      .t-ps-card-hd{position:relative;}
      .t-method-list .t-step{transition:background .25s;}
      .t-method-list .t-step:hover{background:rgba(255,255,255,.03);}
    `;
    document.head.append(s);
  }

  /* ── 10. Cursor CSS ─────────────────────────────────────────────────── */
  function injectCursorCSS() {
    const s = document.createElement('style');
    s.textContent = `
      #pt-cursor{
        position:fixed;top:-6px;left:-6px;width:10px;height:10px;border-radius:50%;
        background:var(--ink,#0A1628);pointer-events:none;z-index:9999;
        mix-blend-mode:difference;will-change:transform;
      }
      #pt-ring{
        position:fixed;top:-22px;left:-22px;width:42px;height:42px;border-radius:50%;
        border:1.5px solid rgba(10,22,40,.3);pointer-events:none;z-index:9998;
        will-change:transform;transition:width .2s,height .2s,border-color .2s,top .2s,left .2s;
      }
      #pt-ring.is-hover{
        width:64px;height:64px;top:-32px;left:-32px;
        border-color:var(--brand,#0A2A55);border-width:2px;
      }
      @media(hover:none){#pt-cursor,#pt-ring{display:none;}}
    `;
    document.head.append(s);
  }

  /* ── boot ───────────────────────────────────────────────────────────── */
  function boot() {
    injectCursorCSS();
    initCursor();
    initNav();
    initParallax();
    initAnchors();
    initLines();
    /* After React mount */
    setTimeout(() => {
      initReveal();
      initCounters();
      initMagnetic();
      initTilt();
    }, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
